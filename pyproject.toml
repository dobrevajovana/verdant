[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "verdy"
version = "0.1.0"
description = "VERDY: match your own terms (species, habitats, parameters, measurements) to the ontologies you choose: ENVO, NCBITaxon, GBIF, PATO, CF, Wikidata, any OLS4 ontology."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]
authors = [{ name = "Jovana Dobreva" }]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/dobrevajovana/verdy"
Source = "https://github.com/dobrevajovana/verdy"
Issues = "https://github.com/dobrevajovana/verdy/issues"

[project.optional-dependencies]
excel = ["pandas>=2.0", "openpyxl>=3.1"]
test = ["pytest>=7"]

[project.scripts]
verdy = "verdy.__main__:main"

[tool.setuptools]
packages = ["verdy"]
