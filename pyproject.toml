[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verdant"
version = "0.1.0"
description = "Match your own terms (species, habitats, parameters, measurements) to the ontologies you choose: ENVO, NCBITaxon, GBIF, PATO, CF, Wikidata, any OLS4 ontology."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]
authors = [{ name = "Jovana Dobreva" }]

[project.optional-dependencies]
excel = ["pandas>=2.0", "openpyxl>=3.1"]
test = ["pytest>=7"]

[project.scripts]
verdant = "verdant.__main__:main"

[tool.setuptools]
packages = ["verdant"]
