# Publish VERDY to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing (OpenID Connect): no password or API token is stored anywhere.
# One-time setup on pypi.org: Account settings -> Publishing -> add a pending publisher with
#   project name: verdy, owner: dobrevajovana, repository: verdy,
#   workflow: publish.yml, environment: pypi

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Test before publishing
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test]"
        pytest -q
    - name: Build the package
      run: |
        python -m pip install build twine
        python -m build
        twine check dist/*
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/verdy
    permissions:
      id-token: write          # lets PyPI verify this upload comes from this repository
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
